# Jobs
- company: Revel Games
  position: Co-Founder, Head Of Engineering
  duration: Jan, 2021 &mdash; Feb, 2025
  summary: As one of the four co-founders of Revel Games, I was responsible for the technical direction and infrastructure of the company. In this role, I led the development team, defined architectural decisions, and ensured the scalability and stability of our projects.
    <p>Beyond the technical challenges, this experience was a profound learning journey in both leadership and company management. Through trial and error, I gained invaluable insights into team dynamics, decision-making, and business strategy. The mistakes I made along the way became critical lessons—shaping my understanding of how to build and lead a team effectively, foster a strong company culture, and drive a vision forward in the competitive gaming industry.</p>
    <h4>Responsibilities</h4>
    <ul>
    <li>Defined technical architecture and infrastructure for multiple game projects, ensuring scalability, maintainability, and performance.</li>
    <li>Led a cross-functional development team, fostering a strong engineering culture through mentoring and collaborative decision-making.</li>
    <li>Established engineering workflows and deployment pipelines to streamline production and improve delivery velocity.</li>
    <li>Oversaw long-term technical strategy aligned with company goals, balancing innovation with pragmatic development choices.</li>
    <li>Played a key role in business strategy and team operations, evolving leadership skills through hands-on experience with startup dynamics.</li>
    </ul>

